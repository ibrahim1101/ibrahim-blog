name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-lock.txt
      - run: python tests.py
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: 'npm', cache-dependency-path: 'website/package-lock.json'}
      - run: npm ci
        working-directory: website
      - run: python -m unittest discover -s tests -v
      - run: npm test
        working-directory: website
      - run: python scripts/test_fixture.py
      - run: npm run build
        working-directory: website
      - run: python scripts/check_site.py
  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: 'npm', cache-dependency-path: 'website/package-lock.json'}
      - run: ./setup.ps1
        shell: pwsh
      - run: ./validate.ps1
        shell: pwsh
